<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cheque Portal — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; color: #1a1a1a; }
  .topbar { background: #1a1a1a; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar button { background: transparent; border: 1px solid #444; color: #ccc; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .topbar button:hover { background: #333; }
  .main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e0; }
  .stat-card .num { font-size: 28px; font-weight: 600; }
  .stat-card .lbl { font-size: 12px; color: #888; margin-top: 2px; }
  .stat-card.warn .num { color: #c07000; }
  .stat-card.danger .num { color: #c0392b; }
  .stat-card.info .num { color: #2d4a9a; }
  .section { background: #fff; border-radius: 10px; border: 1px solid #e5e5e0; margin-bottom: 24px; }
  .section-header { padding: 16px 20px; border-bottom: 1px solid #f0f0ec; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .section-header h2 { font-size: 15px; font-weight: 600; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #f0f0ec; }
  td { padding: 12px 16px; border-bottom: 1px solid #f8f8f4; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }
  .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .badge-pass { background: #e8f5e9; color: #2e7d32; }
  .badge-warn { background: #fff8e1; color: #c07000; }
  .badge-fail { background: #ffebee; color: #c0392b; }
  .badge-pending { background: #f0f0ec; color: #888; }
  .badge-ack { background: #e3f2fd; color: #1565c0; }
  .btn-ack { padding: 6px 14px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-ack:hover { opacity: 0.8; }
  .btn-ack:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { padding: 6px 14px; background: transparent; color: #1a1a1a; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-outline:hover { background: #f4f4f0; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f4f4f0; }
  .login-card { background: #fff; border-radius: 12px; padding: 32px; width: 340px; border: 1px solid #e5e5e0; }
  .login-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: #666; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 12px; outline: none; }
  .login-card input:focus { border-color: #1a1a1a; }
  .login-card button { width: 100%; padding: 11px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .login-card button:hover { opacity: 0.85; }
  .login-err { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #888; line-height: 1; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0ec; font-size: 13px; gap: 16px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-lbl { color: #888; min-width: 140px; }
  .detail-val { font-weight: 500; text-align: right; }
  .check-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f8f8f4; font-size: 13px; gap: 8px; }
  .check-row:last-child { border-bottom: none; }
  .check-note { font-size: 11px; color: #888; margin-top: 2px; }
  .cheque-img { max-width: 100%; border-radius: 8px; border: 1px solid #e5e5e5; margin: 12px 0; display: block; }
  .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; background: #fff; border-radius: 10px; padding: 6px; border: 1px solid #e5e5e0; width: fit-content; }
  .tab { padding: 7px 18px; border-radius: 7px; font-size: 13px; cursor: pointer; border: none; background: transparent; font-family: inherit; color: #666; font-weight: 500; }
  .tab.active { background: #1a1a1a; color: #fff; }
  .firms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 16px; }
  .firm-card { border: 1px solid #e5e5e0; border-radius: 8px; padding: 14px; }
  .firm-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .firm-card p { font-size: 12px; color: #888; margin-bottom: 2px; }
  .firm-link { font-size: 11px; color: #2d4a9a; word-break: break-all; margin-top: 8px; display: block; cursor: pointer; }
  .firm-link:hover { text-decoration: underline; }
  .add-firm-form { padding: 16px; border-top: 1px solid #f0f0ec; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .add-firm-form input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .add-firm-form button { grid-column: 1/-1; padding: 9px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .empty { text-align: center; padding: 40px 16px; color: #aaa; font-size: 14px; }
  @media (max-width: 600px) {
    .main { padding: 16px; }
    .two-col-modal { grid-template-columns: 1fr; }
    th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap" style="display:none;">
  <div class="login-card">
    <h2>Cheque Portal</h2>
    <p>Admin access only</p>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">Sign in</button>
    <p class="login-err" id="login-err">Wrong password. Try again.</p>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <h1>📋 Cheque Portal</h1>
    <div class="topbar-right">
      <span id="topbar-firm" style="font-size:13px;color:#aaa;"></span>
      <button onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('cheques', this)">Cheques</button>
      <button class="tab" onclick="switchTab('firms', this)">Firms</button>
    </div>

    <div id="tab-cheques">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="num" id="s-held">—</div><div class="lbl">Held</div></div>
        <div class="stat-card info"><div class="num" id="s-pending">—</div><div class="lbl">Pending Ack</div></div>
        <div class="stat-card warn"><div class="num" id="s-warn">—</div><div class="lbl">Warnings</div></div>
        <div class="stat-card danger"><div class="num" id="s-fail">—</div><div class="lbl">Failed Verification</div></div>
        <div class="stat-card"><div class="num" id="s-verifying">—</div><div class="lbl">Verifying</div></div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>All Cheques</h2>
          <div class="filters">
            <button class="filter-btn active" onclick="filterCheques('', this)">All</button>
            <button class="filter-btn" onclick="filterCheques('FAIL', this)">Failed</button>
            <button class="filter-btn" onclick="filterCheques('WARN', this)">Warnings</button>
            <button class="filter-btn" onclick="filterCheques('PASS', this)">Passed</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Firm</th>
                <th>Cheque No.</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Bank</th>
                <th>Verification</th>
                <th>Acknowledged</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cheques-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-firms" style="display:none;">
      <div class="section">
        <div class="section-header"><h2>Registered Firms</h2></div>
        <div class="firms-grid" id="firms-grid"></div>
        <div style="border-top:1px solid #f0f0ec;padding:16px 20px;">
          <h3 style="font-size:13px;font-weight:600;margin-bottom:12px;">Add New Firm</h3>
          <div class="add-firm-form">
            <input type="text" id="f-name" placeholder="Firm name *" />
            <input type="text" id="f-contact" placeholder="Contact person" />
            <input type="email" id="f-email" placeholder="Email" />
            <input type="text" id="f-whatsapp" placeholder="WhatsApp number (e.g. +919876543210)" />
            <button onclick="addFirm()">Add Firm & Generate Submission Link</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Cheque Detail Modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
let currentFilter = '';
let allCheques = [];

async function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const res = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pwd }) });
  if (res.ok) { showApp(); }
  else { document.getElementById('login-err').style.display = 'block'; }
}

async function doLogout() {
  await fetch('/admin/logout', { method: 'POST' });
  location.reload();
}

async function checkSession() {
  const res = await fetch('/admin/session');
  const data = await res.json();
  if (data.loggedIn) showApp();
  else document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topbar-firm').textContent = window.location.host;
  loadStats();
  loadCheques();
}

async function loadStats() {
  const res = await fetch('/admin/stats');
  const d = await res.json();
  document.getElementById('s-held').textContent = d.held || 0;
  document.getElementById('s-pending').textContent = d.pending_ack || 0;
  document.getElementById('s-warn').textContent = d.warned || 0;
  document.getElementById('s-fail').textContent = d.failed || 0;
  document.getElementById('s-verifying').textContent = d.verifying || 0;
}

async function loadCheques(verFilter) {
  const params = new URLSearchParams({ status: 'held' });
  if (verFilter) params.set('verification', verFilter);
  const res = await fetch('/admin/cheques?' + params);
  allCheques = await res.json();
  renderCheques(allCheques);
}

function filterCheques(ver, btn) {
  currentFilter = ver;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadCheques(ver);
}

function renderCheques(cheques) {
  const tbody = document.getElementById('cheques-tbody');
  if (!cheques.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No cheques found</td></tr>';
    return;
  }
  tbody.innerHTML = cheques.map(c => {
    const vBadge = c.verification_overall
      ? `<span class="badge badge-${c.verification_overall.toLowerCase()}">${c.verification_overall}</span>`
      : c.verification_status === 'pending'
        ? `<span class="badge badge-pending">Verifying...</span>`
        : `<span class="badge badge-pending">—</span>`;
    const ackBadge = c.acknowledged
      ? `<span class="badge badge-ack">✓ Sent</span>`
      : `<button class="btn-ack" onclick="acknowledge(${c.id}, this)">Acknowledge</button>`;
    const dt = new Date(c.submitted_at).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'2-digit' });
    return `<tr onclick="openDetail(${c.id})" style="cursor:pointer;">
      <td><strong>${c.firm_name}</strong></td>
      <td>${c.cheque_number}</td>
      <td>₹${c.amount_figures}</td>
      <td>${c.cheque_date}</td>
      <td style="font-size:12px;color:#888;">${c.bank_name}</td>
      <td>${vBadge}</td>
      <td>${ackBadge}</td>
      <td style="font-size:11px;color:#aaa;">${dt}</td>
    </tr>`;
  }).join('');
}

async function acknowledge(id, btn) {
  btn.stopPropagation && btn.stopPropagation();
  event.stopPropagation();
  btn.disabled = true;
  btn.textContent = 'Sending...';
  const res = await fetch(`/acknowledge/${id}`, { method: 'POST' });
  if (res.ok) {
    loadStats();
    loadCheques(currentFilter);
    closeModal();
  } else {
    btn.disabled = false;
    btn.textContent = 'Acknowledge';
    alert('Failed to acknowledge. Please try again.');
  }
}

async function openDetail(id) {
  const res = await fetch(`/admin/cheques/${id}`);
  const c = await res.json();
  const vd = c.verification_data;
  const checks = vd?.checks || [];
  const extracted = vd?.extracted || {};

  const checksHtml = checks.map(ch => {
    const cls = ch.status === 'PASS' ? 'badge-pass' : ch.status === 'WARN' ? 'badge-warn' : 'badge-fail';
    return `<div class="check-row">
      <div><div>${ch.label}</div><div class="check-note">${ch.note || ''}</div></div>
      <span class="badge ${cls}">${ch.status}</span>
    </div>`;
  }).join('');

  const ackBtn = c.acknowledged
    ? `<span class="badge badge-ack" style="font-size:13px;padding:6px 14px;">✓ Acknowledged</span>`
    : `<button class="btn-ack" style="padding:9px 20px;font-size:13px;" onclick="acknowledge(${c.id}, this)">Send Acknowledgment</button>`;

  document.getElementById('modal-content').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3>${c.firm_name} — Cheque ${c.cheque_number}</h3>

    <img src="/${c.image_path}" class="cheque-img" alt="Cheque image" />

    ${vd ? `<div style="margin-bottom:16px;">
      <div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">AI Verification</div>
      <div style="background:${vd.overall==='PASS'?'#e8f5e9':vd.overall==='WARN'?'#fff8e1':'#ffebee'};color:${vd.overall==='PASS'?'#2e7d32':vd.overall==='WARN'?'#c07000':'#c0392b'};padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:12px;">
        ${vd.overall}: ${vd.overall_reason}
      </div>
      ${checksHtml}
    </div>` : '<p style="font-size:13px;color:#888;margin-bottom:16px;">Verification pending...</p>'}

    <div style="margin-bottom:16px;">
      <div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Cheque Details</div>
      ${[
        ['Amount', '₹'+c.amount_figures],
        ['Cheque Date', c.cheque_date],
        ['Bank', c.bank_name + (c.branch ? ', '+c.branch : '')],
        ['Submitted', new Date(c.submitted_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})],
        ['Payee (extracted)', extracted.payee || '—'],
        ['Amount words', extracted.amount_words || '—'],
        ['Crossed', extracted.crossed ? 'Yes' : 'No'],
        ['A/c Payee', extracted.ac_payee ? 'Yes' : 'No'],
      ].map(([l,v]) => `<div class="detail-row"><span class="detail-lbl">${l}</span><span class="detail-val">${v}</span></div>`).join('')}
    </div>

    <div style="text-align:right;">${ackBtn}</div>
  `;
  document.getElementById('modal-bg').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-bg').style.display = 'none';
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-cheques').style.display = tab === 'cheques' ? 'block' : 'none';
  document.getElementById('tab-firms').style.display = tab === 'firms' ? 'block' : 'none';
  if (tab === 'firms') loadFirms();
}

async function loadFirms() {
  const res = await fetch('/admin/firms');
  const firms = await res.json();
  const grid = document.getElementById('firms-grid');
  if (!firms.length) { grid.innerHTML = '<p class="empty">No firms yet. Add one below.</p>'; return; }
  grid.innerHTML = firms.map(f => {
    const link = `${window.location.origin}/submit/${f.unique_token}`;
    return `<div class="firm-card">
      <h4>${f.name}</h4>
      <p>${f.contact_name || '—'}</p>
      <p>${f.email || '—'}</p>
      <p>${f.whatsapp || '—'}</p>
      <p style="margin-top:6px;font-size:11px;color:#aaa;">${f.cheque_count} cheque(s)</p>
      <span class="firm-link" onclick="copyLink('${link}')">📋 Copy submission link</span>
    </div>`;
  }).join('');
}

async function addFirm() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Firm name is required'); return; }
  const res = await fetch('/admin/firms', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      name,
      contact_name: document.getElementById('f-contact').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      whatsapp: document.getElementById('f-whatsapp').value.trim()
    })
  });
  if (res.ok) {
    document.getElementById('f-name').value = '';
    document.getElementById('f-contact').value = '';
    document.getElementById('f-email').value = '';
    document.getElementById('f-whatsapp').value = '';
    loadFirms();
  } else {
    alert('Failed to add firm.');
  }
}

function copyLink(link) {
  navigator.clipboard.writeText(link).then(() => alert('Link copied!\n\n' + link));
}

// Auto-refresh every 30s (picks up new verifications)
setInterval(() => { loadStats(); loadCheques(currentFilter); }, 30000);

checkSession();
</script>
</body>
</html>
