<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submit Cheque</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; padding: 24px 16px; color: #1a1a1a; }
  .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 480px; margin: 0 auto; border: 1px solid #e5e5e0; }
  .header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #f0f0ec; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header p { font-size: 13px; color: #666; margin-top: 4px; }
  .firm-badge { background: #f0f4ff; color: #2d4a9a; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; display: inline-block; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 4px; font-weight: 500; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #1a1a1a; outline: none; transition: border-color 0.15s; }
  input:focus, select:focus { border-color: #2d4a9a; box-shadow: 0 0 0 3px rgba(45,74,154,0.08); }
  .field { margin-bottom: 16px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .upload-zone { border: 1.5px dashed #ccc; border-radius: 8px; padding: 28px 16px; text-align: center; cursor: pointer; background: #fafaf8; transition: all 0.15s; }
  .upload-zone:hover { border-color: #2d4a9a; background: #f0f4ff; }
  .upload-zone.has-image { border-color: #2d9a5a; background: #f0fff4; }
  .upload-zone p { font-size: 13px; color: #888; margin-top: 6px; }
  .upload-icon { font-size: 28px; color: #aaa; }
  .preview-img { max-width: 100%; border-radius: 8px; margin-top: 12px; display: none; border: 1px solid #e5e5e5; }
  .btn { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; margin-top: 8px; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .success { text-align: center; padding: 32px 16px; display: none; }
  .success .tick { font-size: 48px; margin-bottom: 12px; }
  .success h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .success p { font-size: 14px; color: #666; line-height: 1.6; }
  .error-msg { background: #fff0f0; color: #c0392b; font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-top: 12px; display: none; }
  .required { color: #c0392b; }
</style>
</head>
<body>

<div class="card" id="form-card">
  <div class="header">
    <h1>Submit Security Cheque</h1>
    <p>Please fill in the cheque details and upload a clear photo of the front of the cheque.</p>
  </div>

  <div id="firm-name-badge" class="firm-badge">Loading...</div>

  <div class="two-col">
    <div class="field">
      <label>Cheque Number <span class="required">*</span></label>
      <input type="text" id="cheque_number" placeholder="e.g. 001234" maxlength="10" />
    </div>
    <div class="field">
      <label>Amount (₹) <span class="required">*</span></label>
      <input type="text" id="amount_figures" placeholder="e.g. 50000" />
    </div>
  </div>

  <div class="two-col">
    <div class="field">
      <label>Cheque Date <span class="required">*</span></label>
      <input type="date" id="cheque_date" />
    </div>
    <div class="field">
      <label>Bank Name <span class="required">*</span></label>
      <input type="text" id="bank_name" placeholder="e.g. SBI" />
    </div>
  </div>

  <div class="field">
    <label>Branch (optional)</label>
    <input type="text" id="branch" placeholder="e.g. Secunderabad Main Branch" />
  </div>

  <div class="field">
    <label>Cheque Photo (front side) <span class="required">*</span></label>
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">📷</div>
      <p>Tap to take photo or upload image</p>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" />
    <img id="preview" class="preview-img" alt="Cheque preview" />
  </div>

  <div class="error-msg" id="error-msg"></div>

  <button class="btn" id="submit-btn" onclick="submitForm()">Submit Cheque</button>
</div>

<div class="success" id="success-card">
  <div class="tick">✅</div>
  <h2>Cheque Submitted</h2>
  <p>Your cheque details have been received.<br/>You will get an acknowledgment on WhatsApp and email once confirmed.</p>
</div>

<script>
const token = window.location.pathname.split('/')[2];
let selectedFile = null;

fetch(`/submit/${token}/info`)
  .then(r => r.json())
  .then(firm => {
    document.getElementById('firm-name-badge').textContent = firm.name;
  })
  .catch(() => {
    document.getElementById('firm-name-badge').textContent = 'Submission Form';
  });

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const preview = document.getElementById('preview');
    preview.src = ev.target.result;
    preview.style.display = 'block';
    document.getElementById('upload-zone').classList.add('has-image');
    document.getElementById('upload-zone').querySelector('p').textContent = '✓ Photo selected — tap to change';
  };
  reader.readAsDataURL(file);
});

async function submitForm() {
  const cheque_number = document.getElementById('cheque_number').value.trim();
  const amount_figures = document.getElementById('amount_figures').value.trim();
  const cheque_date = document.getElementById('cheque_date').value;
  const bank_name = document.getElementById('bank_name').value.trim();
  const branch = document.getElementById('branch').value.trim();
  const errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (!cheque_number || !amount_figures || !cheque_date || !bank_name) {
    errEl.textContent = 'Please fill in all required fields.';
    errEl.style.display = 'block';
    return;
  }
  if (!selectedFile) {
    errEl.textContent = 'Please upload a photo of the cheque.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const formData = new FormData();
  formData.append('cheque_number', cheque_number);
  formData.append('amount_figures', amount_figures);
  formData.append('cheque_date', cheque_date);
  formData.append('bank_name', bank_name);
  formData.append('branch', branch);
  formData.append('cheque_image', selectedFile);

  try {
    const res = await fetch(`/submit/${token}`, { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      document.getElementById('form-card').style.display = 'none';
      document.getElementById('success-card').style.display = 'block';
    } else {
      errEl.textContent = data.error || 'Submission failed. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Cheque';
    }
  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Submit Cheque';
  }
}
</script>
</body>
</html>
